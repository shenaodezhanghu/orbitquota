name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      - name: Build
        run: dotnet build -c Release --nologo
      - name: Verify telemetry and orbit calculations
        shell: pwsh
        run: |
          $test = Start-Process ./bin/Release/net7.0-windows/CodexIsland.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { Get-Content self-test-error.txt; throw 'Self-test failed' }
          if (-not (Test-Path diagnostics/self-test.txt)) { throw 'Missing test report' }
          Get-Content diagnostics/self-test.txt
      - name: Package portable app
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitQuota-win-x64
          path: |
            dist/OrbitQuota-win-x64.zip
            dist/SHA256SUMS.txt
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OrbitQuota-win-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/OrbitQuota-win-x64.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "OrbitQuota $env:GITHUB_REF_NAME" --notes-file docs/releases/v0.1.0.md
